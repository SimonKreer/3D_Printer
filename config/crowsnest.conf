# Crowsnest webcam configuration (own settings only; upstream default header removed)
# Upstream: https://github.com/mainsail-crew/crowsnest

[crowsnest]
log_path: /home/pi/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam 1]
mode: ustreamer
port: 8080
device: /dev/v4l/by-id/usb-GENERAL_GENERAL_WEBCAM-video-index0
resolution: 1280x720
max_fps: 15
