# ===============================
#   Printer Config - DIY
#   Board: SKR Mini E3 V3.0
#   Documentation copy: machine-specific IDs replaced by <PLACEHOLDERS>
# ===============================

[include mainsail.cfg]

[exclude_object]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_<MCU_SERIAL>-if00

[printer]
kinematics: cartesian
max_velocity: 1000
max_accel: 20000
max_z_velocity: 5
max_z_accel: 1
square_corner_velocity: 5.0

# --- Stepper X (mechanical endstop) ---
[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40.511639
endstop_pin: !PC0
position_endstop: 0
position_min: 0
position_max: 265
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
uart_address: 0
run_current: 0.9
stealthchop_threshold: 0

# --- Stepper Y (mechanical endstop) ---
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40.511639
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 256
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
uart_address: 2
run_current: 1.3
stealthchop_threshold: 0   

# --- Stepper Z ---
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 1.5       # TR8x1.5 lead screw
endstop_pin: ^!PC2   # mechanical endstop
#position_endstop: 1.4
position_min: 0
position_max: 150
homing_speed: 3 

[tmc2209 stepper_z]
uart_pin: PC11
diag_pin: PD4
uart_address: 1
run_current: 2.0
stealthchop_threshold: 0

# --- Extruder ---
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.5499888325 #23.2474111675
gear_ratio: 1:1
nozzle_diameter: 0.4
filament_diameter: 1.75
heater_pin: PC8
sensor_type: PT1000
sensor_pin: PA0
min_temp: 0
max_temp: 300

# --- Heatbed ---
[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: 0
max_temp: 130

# --- Fans ---
[heater_fan hotend_fan]
pin: PC7               # Hotend-Lüfter (FAN1 auf SKR Mini E3 V3)
heater: extruder
heater_temp: 40.0
kick_start_time: 0.500

[fan]
pin: PB15                  # Bauteillüfter (FAN0 auf SKR Mini E3 V3)
kick_start_time: 0.2
off_below: 0.10

# --- Bed Screws ---
[bed_screws]
screw1: 58,51
screw2: 229,51
screw3: 58,222
screw4: 229,222

# --- Client Variables ---
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 10.0
variable_custom_park_y    : 10.0
variable_custom_park_dz   : 5.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 10.0
variable_park_at_cancel_y : 10.0
variable_use_fw_retract   : False
variable_idle_timeout     : 600
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: ""
gcode:


#####################################################################
# LICHT - TOGGLE-MAKROS (Steuern Moonraker Power-Geräte)
#####################################################################

[gcode_macro TOGGLE_DRUCKKOPFLICHT]
variable_state: 1
gcode:
    {% if printer["gcode_macro TOGGLE_DRUCKKOPFLICHT"].state == 0 %}
        {action_call_remote_method("set_device_power", device="licht_druckkopf", state="on")}
        SET_GCODE_VARIABLE MACRO=TOGGLE_DRUCKKOPFLICHT VARIABLE=state VALUE=1
        {action_respond_info("Druckkopflicht: AN")}
    {% else %}
        {action_call_remote_method("set_device_power", device="licht_druckkopf", state="off")}
        SET_GCODE_VARIABLE MACRO=TOGGLE_DRUCKKOPFLICHT VARIABLE=state VALUE=0
        {action_respond_info("Druckkopflicht: AUS")}
    {% endif %}

[gcode_macro TOGGLE_RAUMLICHT]
variable_state: 1
gcode:
    {% if printer["gcode_macro TOGGLE_RAUMLICHT"].state == 0 %}
        {action_call_remote_method("set_device_power", device="licht_druckraum", state="on")}
        SET_GCODE_VARIABLE MACRO=TOGGLE_RAUMLICHT VARIABLE=state VALUE=1
        {action_respond_info("Raumlicht: AN")}
    {% else %}
        {action_call_remote_method("set_device_power", device="licht_druckraum", state="off")}
        SET_GCODE_VARIABLE MACRO=TOGGLE_RAUMLICHT VARIABLE=state VALUE=0
        {action_respond_info("Raumlicht: AUS")}
    {% endif %}


#####################################################################
# LICHT BEIM DRUCKSTART AUTOMATISCH EINSCHALTEN
#####################################################################

[gcode_macro PRINT_START]
gcode:
    {action_call_remote_method("set_device_power", device="licht_druckkopf", state="on")}
    SET_GCODE_VARIABLE MACRO=TOGGLE_DRUCKKOPFLICHT VARIABLE=state VALUE=1
    {action_call_remote_method("set_device_power", device="licht_druckraum", state="on")}
    SET_GCODE_VARIABLE MACRO=TOGGLE_RAUMLICHT VARIABLE=state VALUE=1

[gcode_macro POWER_ON_PRINTER]
gcode:
  {action_call_remote_method("set_device_power", device="printer_power", state="on")}
  G4 P2000
  FIRMWARE_RESTART

